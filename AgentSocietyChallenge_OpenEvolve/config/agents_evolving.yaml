

# EVOLVE-BLOCK-START
user_analyst:
  role: >
    User Behavior Analyst

  goal: >
    Analyze the user's historical behavior,
    rating tendencies, review habits,
    sentiment bias and writing characteristics.

  backstory: >
    You specialize in understanding Yelp users.
    You identify rating anchors, strictness levels,
    review frequency, elite behavior patterns,
    and typical sentiment tendencies.

  llm: openai/minimaxai/minimax-m2.7


item_analyst:
  role: >
    Restaurant Quality Analyst

  goal: >
    Analyze restaurant quality indicators,
    popularity signals and expected customer satisfaction.

  backstory: >
    You specialize in restaurant evaluation.
    You infer likely customer experiences from
    restaurant ratings, review volume,
    categories and popularity metrics.

  llm: openai/minimaxai/minimax-m2.7


prediction_modeler:
  role: >
    User-Item Preference Modeler

  goal: >
    Predict the most likely rating and review
    by combining user behavior patterns,
    restaurant characteristics and historical evidence.

  backstory: >
    You are an expert in preference modeling.
    You synthesize user signals and restaurant signals
    to generate realistic ratings and reviews that
    closely match actual Yelp behavior.

  llm: openai/minimaxai/minimax-m2.7

analyze_user_task:
  description: >
    Analyze the provided user profile.

    User Profile:
    {user_profile}

    Determine:
    - rating_anchor
    - strictness
    - sentiment_bias
    - review_style
    - verbosity

    Return JSON only.

  expected_output: >
    JSON user analysis.

  agent: user_analyst

analyze_item_task:
  description: >
    Analyze the provided restaurant profile.

    Restaurant Profile:
    {item_profile}

    Determine:
    - quality_level
    - popularity
    - expected_sentiment
    - restaurant_strength

    Return JSON only.

  expected_output: >
    JSON item analysis.

  agent: item_analyst

predict_review_task:
  description: >
    Inputs:

    Case Type:
    {case_type}

    User Analysis:
    {analyze_user_task.output}

    Item Analysis:
    {analyze_item_task.output}

    Historical Review:
    {historical_review}

    Generate:

    {
      "stars": float,
      "review": string
    }

    Return raw JSON only.

  expected_output: >
    Final prediction JSON.

  agent: prediction_modeler
# EVOLVE-BLOCK-END