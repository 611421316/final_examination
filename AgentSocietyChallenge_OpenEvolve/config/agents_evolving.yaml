# Optimized OpenEvolve configuration for 5-agent CrewAI Yelp simulation
# Initial program : config/agents.yaml
# Evaluator       : openevolve_evaluator.py
#
# Run command:
#   uv run --env-file .env python -m openevolve.cli \
#       config/agents.yaml \
#       openevolve_evaluator.py \
#       --config config/openevolve_config.yaml \
#       --output config/openevolve_output \
#       --iterations 50

max_iterations: 50
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

diff_based_evolution: false
language: "text"
max_code_length: 12000

llm:
  models:
    - name: "minimaxai/minimax-m2.7"
      weight: 1.0
  api_base: "https://integrate.api.nvidia.com/v1"
  api_key: null
  temperature: 0.5
  max_tokens: 4096
  timeout: 120
  retries: 3
  retry_delay: 30

prompt:
  system_message: |
    You are optimizing the EVOLVE-BLOCK of a CrewAI YAML file for a multi-agent Yelp rating and review simulation task.

    The system uses exactly five agents:

    1. data_retriever
       - must call build_prediction_context
       - build_prediction_context is the only tool in the main path
       - preserves exact returned fields
       - does not predict or invent

    2. case_analyst
       - classifies the prediction case:
         Case 1: user exists, item exists, direct review exists
         Case 2: user exists, item exists, no direct review
         Case 3: user missing, item exists
         Case 4: user missing, item missing

    3. user_behavior_analyst
       - analyzes user average_stars, review_count, rating_tendency, engagement, and style examples

    4. item_review_context_analyst
       - analyzes item stars, review_count, categories, attributes, direct review evidence, and safe review details

    5. prediction_modeler
       - must use predicted_stars exactly
       - must output valid JSON only
       - must not recalculate stars
       - must not reveal reasoning

    The deterministic Python tool build_prediction_context already handles:
    - exact user lookup
    - exact item lookup
    - review lookup
    - direct review matching
    - case flags
    - weighted rating prediction
    - fallback defaults
    - style examples

    Optimization goals:
    - improve star rating accuracy
    - preserve predicted_stars exactly
    - improve review authenticity
    - reduce hallucination
    - keep outputs compact
    - maintain a real multi-agent structure
    - keep final JSON valid

    Rules:
    - Return the complete YAML file with EVOLVE-BLOCK-START and EVOLVE-BLOCK-END markers.
    - Keep YAML valid.
    - Do not change llm fields.
    - Do not add new agents.
    - Do not remove the multi-agent structure.
    - Do not add unavailable tools.
    - Do not add fake none/None tools.
    - Do not reintroduce internet search into the main path.
    - Do not instruct agents to invent likes, dislikes, strengths, weaknesses, dishes, or facts.
    - prediction_modeler must never recalculate or override predicted_stars.
    - The final output must remain JSON only.

  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: false

database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  migration_interval: 10
  migration_rate: 0.1
  feature_dimensions:
    - "complexity"
    - "diversity"

evaluator:
  timeout: 900
  max_retries: 2
  parallel_evaluations: 1
  cascade_evaluation: false