# OpenEvolve configuration for AgentSociety CrewAI agent prompt evolution
# Initial program : config/agents_evolving.yaml
# Evaluator       : openevolve_evaluator.py
# Run command     :
#   uv run openevolve config/agents_evolving.yaml openevolve_evaluator.py \
#     --config config/openevolve_config.yaml \
#     --output config/openevolve_output

# ── General ───────────────────────────────────────────────────────────────────
max_iterations: 50
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

# ── Evolution strategy ────────────────────────────────────────────────────────
# Full-rewrite is recommended for YAML / prompt evolution
# (diff-based mode generates SEARCH/REPLACE patches that easily corrupt YAML structure)
diff_based_evolution: false
language: "text"
max_code_length: 20000

# ── LLM ────────────────────────────────────────────────────────────────────────────────
llm:
  models:
    # minimaxai/minimax-m2.7 was timing out on all 4 retries on NVIDIA NIM.
    # Using meta/llama-3.1-8b-instruct (same endpoint) which is proven to work.
    - name: "meta/llama-3.1-8b-instruct"
      weight: 1.0
  api_base: "https://integrate.api.nvidia.com/v1"
  api_key: null          # reads from OPENAI_API_KEY env variable
  temperature: 0.7
  max_tokens: 4096
  timeout: 180           # increased from 120 — llama-3.1 is slower but reliable
  retries: 3           # 改回保守値；過多 retry 會放大整體 wall time 而不一定提高成功率
  retry_delay: 10      # reduced from 30 — llama-3.1 doesn’t need long waits between retries

# ── Prompt ────────────────────────────────────────────────────────────────────
prompt:
  system_message: |
    You are an expert prompt engineer specializing in multi-agent AI systems.
    You are evolving a multi-file bundle that configures a CrewAI simulation system.
    The bundle contains THREE sections separated by '=== SECTION: <name> ===' markers:

    --- SECTION: agents ---
    YAML configuration for 6 CrewAI agents:
      - internet_researcher: searches for general rating behavior patterns
      - user_analyst:        retrieves and analyses user profile statistics
      - item_analyst:        retrieves and analyses business quality indicators
      - review_analyst:      retrieves and analyses historical reviews
      - prediction_modeler:  predicts star rating + generates review text
      - reviewer:            quality-checks the prediction output

    --- SECTION: tasks ---
    YAML configuration for 5 CrewAI tasks:
      - internet_research_task, analyze_user_task, analyze_item_task,
        analyze_reviews_task, predict_review_task

    --- SECTION: crew ---
    Python-style CREW_CONFIG dict controlling:
      - agents_order: list of agent names (determines execution priority)
      - tasks_order:  list of task names (determines execution order)
      - process:      "sequential" or "hierarchical"
      - agent_settings: per-agent max_rpm and verbose flag

    YOUR GOAL: Rewrite the EVOLVE-BLOCK so that the system produces
    star ratings closer to the user's actual historical average AND
    review texts that authentically match the user's writing style.

    STRICT RULES:
    - Keep all three '=== SECTION: xxx ===' headers EXACTLY as-is.
    - Keep EVOLVE-BLOCK-START and EVOLVE-BLOCK-END markers.
    - Keep the docstring at the top of the bundle EXACTLY as-is.
    - In [agents]: you MAY change role/goal/backstory freely.
      Do NOT change any `llm:` field.
    - In [tasks]: you MAY change description/expected_output.
      Keep all `agent:` keys pointing to valid agent names.
      Keep all tool Action names (lookup_user_by_id, lookup_item_by_id,
      lookup_reviews_by_user_and_item, search_internet) unchanged.
    - In [crew]: you MAY change CREW_CONFIG values ONLY:
      agents_order, tasks_order, process, agent_settings (max_rpm, verbose).
      Do NOT change anything else in this section.
    - Return the COMPLETE file (all sections, no truncation).
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: false

# ── Database ──────────────────────────────────────────────────────────────────
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  migration_interval: 10
  migration_rate: 0.1
  # Use built-in features; no custom feature_dimensions needed
  feature_dimensions:
    - "complexity"
    - "diversity"

# ── Evaluator ────────────────────────────────────────────────────────────────
evaluator:
  # Each simulation run: 5 tasks × up to 5 min/task with 2 workers ≈ ~15 min worst case
  timeout: 900
  max_retries: 2
  parallel_evaluations: 1
  cascade_evaluation: false   # we only have evaluate(), no stage1/stage2
