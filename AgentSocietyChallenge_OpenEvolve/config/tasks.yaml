
analyze_user_task:
  description: >
    Analyze the provided user profile.

    User Profile:
    {user_profile}

    Determine:
    - rating_anchor
    - strictness
    - sentiment_bias
    - review_style
    - verbosity

    Return JSON only.

  expected_output: >
    JSON user analysis.

  agent: user_analyst

analyze_item_task:
  description: >
    Analyze the provided restaurant profile.

    Restaurant Profile:
    {item_profile}

    Determine:
    - quality_level
    - popularity
    - expected_sentiment
    - restaurant_strength

    Return JSON only.

  expected_output: >
    JSON item analysis.

  agent: item_analyst

predict_review_task:
  description: >
    Inputs:

    Case Type:
    {case_type}

    User Analysis:
    {analyze_user_task.output}

    Item Analysis:
    {analyze_item_task.output}

    Historical Review:
    {historical_review}

    Generate:

    {
      "stars": float,
      "review": string
    }

    Return raw JSON only.

  expected_output: >
    Final prediction JSON.

  agent: prediction_modeler
