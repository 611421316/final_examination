predict_review_task:
  description: >
    Predict the rating and write a review based on the following pre-fetched context.
    
    Case Type: {case_type}
    
    User Profile: {user_profile}
    Item Profile: {item_profile}
    Historical Review: {historical_review}
    
    INSTRUCTIONS:
    - If Case Type is "User + Restaurant + Review", heavily rely on the historical review's sentiment and rating. Focus on rewriting it in a natural way while maintaining the original meaning.
    - If Case Type is "User + Restaurant", infer the rating from the user's average_stars and the restaurant's stars. Write a review matching the user's style based on the restaurant's attributes.
    - If Case Type is "Restaurant Only", act as a typical user reviewing a restaurant with the given attributes and overall rating.
    - If Case Type is "No User and No Restaurant", provide a neutral, balanced generic review.
    
    OUTPUT:
    You must output a raw JSON dictionary containing exactly two keys: "stars" (float) and "review" (string). DO NOT add markdown blocks or conversational text.
  expected_output: >
    A JSON dictionary containing "stars" and "review" keys.
  agent: behavior_reasoning_agent