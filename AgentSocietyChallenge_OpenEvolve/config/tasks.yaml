retrieve_data_task:
  description: >
    Retrieve deterministic Yelp prediction context.

    INPUT VARIABLES:
    - user_id: {user_id}
    - item_id: {item_id}

    REQUIRED TOOL USE:
    - You must call build_prediction_context exactly once using the given user_id and item_id.
    - After the tool returns, output the returned JSON object only.
    - Do not summarize the tool result.
    - Do not add markdown.
    - Do not add explanations.
    - Do not invent missing data.
    - Preserve predicted_stars exactly as returned by the tool.

    Required output fields:
    - case
    - user
    - item
    - review_style
    - predicted_stars
    - final_instruction

  expected_output: >
    {
      "case": {
        "user_exists": true,
        "item_exists": true,
        "direct_review_exists": false
      },
      "user": {},
      "item": {},
      "review_style": {},
      "predicted_stars": 4.0,
      "final_instruction": "Use predicted_stars exactly. Generate one natural Yelp-style review. Do not mention IDs, formulas, tool names, or unsupported facts. Output only valid JSON."
    }
  agent: exact_yelp_data_retriever


detect_case_task:
  description: >
    Determine the prediction case using retrieve_data_task output only.

    FULL 8-CASE DEFINITIONS:
    - Case 1: user exists, item exists, direct historical review exists.
    - Case 2: user exists, item exists, no direct historical review.
    - Case 3: user missing, item exists, direct historical review exists.
    - Case 4: user missing, item exists, no direct historical review.
    - Case 5: user exists, item missing, direct historical review exists.
    - Case 6: user exists, item missing, no direct historical review.
    - Case 7: user missing, item missing, direct historical review exists.
    - Case 8: user missing, item missing, no direct historical review.

    STRICT RULES:
    - Use retrieve_data_task output only.
    - Read case.user_exists, case.item_exists, and case.direct_review_exists exactly.
    - Do not call any Action.
    - Do not use tools.
    - Do not write "Thought:".
    - Do not write "Action:".
    - Do not write "Action Input:".
    - Do not invent missing data.
    - Keep output compact.
    - Output only one valid JSON object.

    Decision logic:
    - If user_exists=true, item_exists=true, direct_review_exists=true => case_number=1.
    - If user_exists=true, item_exists=true, direct_review_exists=false => case_number=2.
    - If user_exists=false, item_exists=true, direct_review_exists=true => case_number=3.
    - If user_exists=false, item_exists=true, direct_review_exists=false => case_number=4.
    - If user_exists=true, item_exists=false, direct_review_exists=true => case_number=5.
    - If user_exists=true, item_exists=false, direct_review_exists=false => case_number=6.
    - If user_exists=false, item_exists=false, direct_review_exists=true => case_number=7.
    - If user_exists=false, item_exists=false, direct_review_exists=false => case_number=8.

    Evidence priority:
    - If direct_review_exists=true, direct review evidence is strongest.
    - If direct_review_exists=false and user_exists=true and item_exists=true, use user and item context.
    - If only user_exists=true, use user context and avoid item-specific details.
    - If only item_exists=true, use item context and avoid user-specific behavior.
    - If no evidence exists, use generic fallback and avoid unsupported details.

  expected_output: >
    {
      "case_number": 2,
      "case_name": "Case 2: user exists, item exists, no direct historical review",
      "flags": {
        "user_exists": true,
        "item_exists": true,
        "direct_review_exists": false
      },
      "dominant_evidence": "user_and_item_profiles",
      "fallback_policy": "use predicted_stars exactly; use available user and item context for review text only"
    }
  agent: yelp_case_detection_analyst
  context:
    - retrieve_data_task


analyze_user_behavior_task:
  description: >
    Analyze user behavior using retrieve_data_task and detect_case_task outputs.

    STRICT RULES:
    - Use previous task outputs only.
    - Do not call any Action.
    - Do not use tools.
    - Do not write "Thought:".
    - Do not write "Action:".
    - Do not write "Action Input:".
    - Do not invent likes or dislikes.
    - Use user.rating_tendency exactly if present.
    - Use user.average_stars as the main rating tendency signal if rating_tendency is missing.
    - Use user.review_count as the confidence signal.
    - Use useful, funny, cool, and fans as engagement signals.
    - Use review_style.style_examples only as writing-style evidence, not as factual preferences.
    - If user_exists=false, clearly state that user behavior evidence is unavailable.
    - Output only one valid JSON object.

    Confidence guide:
    - review_count >= 100: high
    - 10 <= review_count < 100: medium
    - 1 <= review_count < 10: low
    - review_count = 0 or missing: very_low
    - user_exists=false: unavailable

  expected_output: >
    {
      "rating_tendency": "moderate",
      "user_confidence": "high",
      "user_evidence_available": true,
      "engagement_signals": {
        "review_count": 1158,
        "fans": 102,
        "useful": 3875,
        "funny": 1400,
        "cool": 1999
      },
      "likely_review_tone": "positive but balanced",
      "rating_behavior_summary": "The user tends to give moderately positive ratings with high confidence due to a large review history.",
      "evidence_limitations": "No direct historical review for this exact user-item pair is available."
    }
  agent: yelp_user_behavior_analyst
  context:
    - retrieve_data_task
    - detect_case_task


analyze_item_review_context_task:
  description: >
    Analyze business context and review-style evidence using previous outputs.

    STRICT RULES:
    - Use previous task outputs only.
    - Do not call any Action.
    - Do not use tools.
    - Do not write "Thought:".
    - Do not write "Action:".
    - Do not write "Action Input:".
    - Use item.stars and item.review_count as main business signals when item_exists=true.
    - Use categories and attributes only when present.
    - Use review_style.direct_review_exists and review_style.direct_review_stars as strongest evidence when present.
    - Do not invent dishes, service issues, business names, menu items, prices, or facts.
    - If item_exists=false, clearly state that item context is unavailable.
    - Output only one valid JSON object.

  expected_output: >
    {
      "item_quality_signal": {
        "item_evidence_available": true,
        "item_stars": 4.0,
        "item_review_count": 229,
        "predicted_stars": 4.0
      },
      "category_context": {
        "categories": "Restaurants, Italian, Pizza"
      },
      "direct_review_evidence": {
        "direct_review_exists": false,
        "direct_review_stars": null
      },
      "review_style_evidence": {
        "likely_review_tone": "positive but balanced",
        "avg_word_count": 100,
        "style_examples_available": true
      },
      "safe_details": {
        "can_mention_business_name": true,
        "can_mention_category": true,
        "can_mention_general_food": true,
        "can_mention_specific_items": false,
        "can_mention_service": false,
        "can_mention_price": false
      },
      "evidence_limitations": "Only safe item/category and style evidence should be used; unsupported specifics must be avoided."
    }
  agent: yelp_item_review_context_analyst
  context:
    - retrieve_data_task
    - detect_case_task
    - analyze_user_behavior_task


predict_review_task:
  description: >
    Produce the final Yelp rating and review JSON.

    REQUIRED RULES:
    - Use predicted_stars from retrieve_data_task exactly.
    - Do not recalculate stars.
    - Do not override stars.
    - Do not call any Action.
    - Do not use tools.
    - Do not write "Thought:".
    - Do not write "Action:".
    - Do not write "Action Input:".
    - Do not output markdown.
    - Do not mention user_id or item_id.
    - Do not mention formulas, tools, agents, tasks, database fields, or case numbers.
    - Generate one natural Yelp-style review.
    - Only use safe supported details from previous outputs.
    - Do not invent unsupported specific dishes, prices, employee names, or factual claims.
    - If direct_review_exists=true, align the review sentiment with direct review evidence.
    - If user evidence is missing, do not describe user habits or preferences.
    - If item evidence is missing, do not describe item-specific facts.
    - If both user and item are missing and no direct review exists, write a generic review.
    - Output only one valid JSON object.

    FINAL FORMAT:
    {"stars": <float between 1.0 and 5.0>, "review": "<natural Yelp-style review text>"}

  expected_output: >
    {"stars": 4.0, "review": "A natural Yelp-style review that matches the predicted rating and uses only safe supported context."}
  agent: deterministic_yelp_review_simulator
  context:
    - retrieve_data_task
    - detect_case_task
    - analyze_user_behavior_task
    - analyze_item_review_context_task