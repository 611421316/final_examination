# OpenEvolve initial program for rating-formula and review-guidance evolution.
# Intended path: config/eval_evolving.yaml

version: 2
name: yelp_rating_review_eval_policy_research_quality

fixed_contract:
  input_context:
    required_fields:
      - user
      - item
      - review_style
      - evidence_summary
      - review_policy
      - case
      - predicted_stars

  output_contract:
    final_json_only: true
    required_output_fields:
      stars: float
      review: string
    stars_range: [1.0, 5.0]
    stars_step: 0.5

  non_evolvable_rules:
    - Do not change data file paths.
    - Do not change lookup function names.
    - Do not change CrewAI tool names.
    - Do not change output JSON schema.
    - Do not invent user, item, or review facts.
    - If direct_review_exists is true, direct_review_stars must be the strongest rating signal.
    - Final output stars must equal predicted_stars exactly.
    - Review text must be grounded only in supplied context.

# EVOLVE-BLOCK-START

rating_policy:
  default_prior: 3.8

  rounding:
    mode: nearest_half_up
    min_stars: 1.0
    max_stars: 5.0

  case_rules:
    case_1:
      condition: "user_exists=true,item_exists=true,direct_review_exists=true"
      method: direct_review_stars
      direct_review_weight: 1.0
      explanation: >
        Use exact historical user-item review stars because the direct review exists.
        User and item context may support review wording only.

    case_2:
      condition: "user_exists=true,item_exists=true,direct_review_exists=false"
      method: weighted_user_item_history_blend

      base_user_weight: 0.65
      base_item_weight: 0.35

      user_confidence_divisor: 50.0
      item_confidence_divisor: 100.0

      user_confidence_bonus: 0.25
      item_confidence_bonus: 0.20

      historical_user_review_blend_weight: 0.30
      historical_user_review_min_count: 3

      historical_item_review_blend_weight: 0.15
      historical_item_review_min_count: 3

      user_anchor_min_review_count: 30
      user_anchor_max_delta: 0.70

      item_anchor_min_review_count: 80
      item_anchor_max_delta: 1.10

      explanation: >
        Blend user average, item average, user historical review behavior, and item
        historical review evidence. Increase user influence when user profile is
        reliable; increase item influence when item profile is reliable. Do not
        claim direct experience by this user because direct_review_exists is false.

    case_3:
      condition: "user_exists=false,item_exists=true,direct_review_exists=true"
      method: direct_review_stars
      direct_review_weight: 1.0
      explanation: >
        Use exact historical review stars. Item context is used only for grounded wording.

    case_4:
      condition: "user_exists=false,item_exists=true,direct_review_exists=false"
      method: item_stars_with_item_history
      item_weight: 1.0
      item_history_blend_weight: 0.25
      explanation: >
        With no user profile and no direct review, use item average stars and item
        review history if available. Avoid user-specific claims.

    case_5:
      condition: "user_exists=true,item_exists=false,direct_review_exists=true"
      method: direct_review_stars
      direct_review_weight: 1.0
      explanation: >
        Use exact historical review stars. User profile is used only for tone.

    case_6:
      condition: "user_exists=true,item_exists=false,direct_review_exists=false"
      method: user_average_with_user_history
      user_weight: 1.0
      user_history_blend_weight: 0.25
      explanation: >
        With no item profile and no direct review, use user average stars and user
        history. Keep item details generic.

    case_7:
      condition: "user_exists=false,item_exists=false,direct_review_exists=true"
      method: direct_review_stars
      direct_review_weight: 1.0
      explanation: >
        Use exact historical review stars and avoid unsupported profile or item facts.

    case_8:
      condition: "user_exists=false,item_exists=false,direct_review_exists=false"
      method: default_prior
      explanation: >
        No evidence is available, so use default prior and generate a generic,
        low-specificity review.

review_policy:
  global_rules:
    - 'Output only one JSON object: {"stars": <float>, "review": "<text>"}.'
    - The output stars must equal predicted_stars exactly.
    - Do not recalculate stars inside the final review agent.
    - Do not mention IDs, formulas, tools, agents, YAML, or database fields.
    - Do not invent dishes, prices, service details, locations, or user preferences.
    - Use direct review evidence first when present.
    - If no direct review exists, never imply the user has reviewed or visited this exact item before.
    - Keep the review natural, Yelp-like, and consistent with predicted_stars.
    - Prefer concise concrete wording over generic praise.
    - Avoid unsupported named dishes, staff names, prices, wait times, and neighborhood details.

  sentiment_by_star:
    one_to_two:
      range: [1.0, 2.0]
      tone: clearly negative
      guidance: >
        Write a dissatisfied review. Mention concrete disappointments only if supported
        by evidence. Avoid sounding neutral or positive.

    two_half_to_three:
      range: [2.5, 3.0]
      tone: mixed or lukewarm
      guidance: >
        Balance positives and negatives. The review should sound acceptable but not
        strongly recommended. Avoid overly enthusiastic phrases.

    three_half:
      range: [3.5, 3.5]
      tone: moderately positive with caveats
      guidance: >
        Mention generally good aspects while including a limitation or mild reservation.

    four_to_five:
      range: [4.0, 5.0]
      tone: positive
      guidance: >
        Write a satisfied review. Highlight strengths supported by item/user evidence,
        but avoid unsupported specifics.

  case_review_guidance:
    case_1: >
      Use direct review content and item facts. Preserve original sentiment direction.
      The direct review is the strongest evidence.

    case_2: >
      Use user rating tendency, user history style examples, item categories, and item
      quality evidence. Do not imply this user has reviewed this exact item before.

    case_3: >
      Use direct review content and item facts. Do not infer user history or user preferences.

    case_4: >
      Use item facts and item history only. Write a plausible item-grounded review matching
      item average rating. Avoid user-specific claims.

    case_5: >
      Use direct review content and user tendency. Avoid item-specific facts if item profile is missing.

    case_6: >
      Use user rating tendency and user writing style only. Keep item details generic and low-specificity.

    case_7: >
      Use direct review content only. Avoid both user-profile and item-profile claims.

    case_8: >
      Use generic fallback review. Keep language neutral, low-specificity, and consistent with default prior.

optimization_notes:
  primary_metric: star_accuracy
  secondary_metric: review_fidelity
  tertiary_metric: json_validity

  evolvable_search_space:
    - rating_policy.default_prior
    - rating_policy.case_rules.case_2.base_user_weight
    - rating_policy.case_rules.case_2.base_item_weight
    - rating_policy.case_rules.case_2.user_confidence_divisor
    - rating_policy.case_rules.case_2.item_confidence_divisor
    - rating_policy.case_rules.case_2.user_confidence_bonus
    - rating_policy.case_rules.case_2.item_confidence_bonus
    - rating_policy.case_rules.case_2.historical_user_review_blend_weight
    - rating_policy.case_rules.case_2.historical_item_review_blend_weight
    - rating_policy.case_rules.case_2.user_anchor_max_delta
    - rating_policy.case_rules.case_2.item_anchor_max_delta
    - review_policy.sentiment_by_star
    - review_policy.case_review_guidance

# EVOLVE-BLOCK-END