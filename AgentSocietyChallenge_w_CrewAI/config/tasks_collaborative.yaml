# === Step 5: Strictly Separated Task Definitions ===
analyze_item_task:
  description: >
    Use the search_restaurant_feature_data tool to find information about business {item_id}.

    You MUST call the tool with a natural language search_query string, for example:
    Action: search_restaurant_feature_data
    Action Input: {"search_query": "What are the categories and star rating for business {item_id}"}

    Also use search_historical_reviews_data to find past reviews about this business.

    Analyze:
    - Restaurant categories
    - Star rating
    - Attributes
    - Common positive feedback
    - Common negative feedback
    - Overall public sentiment

  expected_output: >
    A detailed markdown report of business {item_id}'s features, pros, and cons.
  agent: item_analyst


predict_review_task:
  description: >
    Using the User Profile, Item Report, and External Research from the previous tasks,
    predict the Stars from 1 to 5 and write the Review Text.

    You MUST base your prediction on the actual data retrieved by the previous agents.
    Do NOT say the data was not found.

    Consider:
    - Whether the restaurant matches the user's historical preferences
    - The user's average rating behavior
    - The business's strengths and weaknesses
    - General restaurant rating patterns

  expected_output: >
    A draft JSON object with exactly two keys:
    {"stars": 4, "review": "The review text..."}
  agent: prediction_modeler


review_prediction_task:
  description: >
    Review the draft prediction from the Prediction Modeler.

    Check:
    - Whether the predicted stars are consistent with the user's rating habits
    - Whether the review text matches the business features
    - Whether the prediction is grounded in retrieved data
    - Whether the JSON format is valid
    - Whether the review sounds natural and realistic

    IMPORTANT:
    - Do NOT invent new user or business facts
    - Do NOT call tools
    - Only review and suggest corrections if needed

  expected_output: >
    A concise review report with:
    - Validity check
    - Problems found, if any
    - Suggested final stars
    - Suggested final review text
  agent: reviewer


final_prediction_task:
  description: >
    Produce the final prediction using:
    - User Profile
    - Item Report
    - External Research
    - Draft Prediction
    - Reviewer Feedback

    IMPORTANT:
    - Output ONLY a valid JSON object
    - Use exactly two keys: "stars" and "review"
    - "stars" must be a integer from 1 to 5
    - "review" must be a string
    - Do NOT include markdown
    - Do NOT include explanations
    - Do NOT include text before or after the JSON
    - Do NOT use double curly braces

  expected_output: >
    {"stars": 4, "review": "The review text..."}
  agent: prediction_modeler