# === Collaborative-style Sequential Task Definitions ===

internet_research_task:
  description: >
    Provide general insights about restaurant reviews and rating behavior using internet search if available.

    Focus on:
    - Why users give 1–2 stars
    - Why users give 3 stars
    - Why users give 4–5 stars
    - Common rating factors: food, service, price, waiting time, atmosphere

    REQUIRED ACTIONS:
    - Call search_internet using a natural language query.
    - The ONLY valid input key for the tool is "search_query". Do NOT use "description" or any other key.

    STRICT RULES:
    - Do NOT fabricate information about user {user_id} or business {item_id}
    - Only provide general restaurant rating patterns
    - Keep the output concise
    - Maximum 5 bullet points
    - NEVER pass a dictionary with a "description" key to the tool. Use "search_query".

  expected_output: >
    Concise bullet points about general restaurant rating behavior.

  agent: internet_researcher


analyze_user_task:
  description: >
    Analyze user {user_id} using available RAG tools.

    STEP 1 - Get user profile (REQUIRED, do this FIRST):
    Action: lookup_user_by_id
    Action Input: {{"user_id": "{user_id}"}}

    STEP 2 - Analyze the retrieved data:
    - Identify EXACT average rating (from average_stars field). This is critical.
    - Review count and yelping_since
    - Identify top 3 common compliments (what the user likes) and top 3 complaints (what the user hates) based on historical behavior or general profile metrics.

    STRICT RULES:
    - If the user profile is not found (returns "No user found"), assume default averages: average rating of 3.8 stars, neutral preferences, yelping since 2018, and flag the profile as "Default/New User".
    - You MUST call tools ONE AT A TIME
    - MUST use tool outputs — do NOT invent user facts
    - Action Input must be ONE dictionary only
    - Do NOT return a list of JSON objects in Action Input

  expected_output: >
    A structured markdown user profile report including:
    - Average rating
    - Review count and tenure
    - Engagement metrics
    - User Profile Status (Normal or Default/New User)

  agent: user_analyst


analyze_item_task:
  description: >
    Analyze business {item_id} using available RAG tools.

    STEP 1 - Get business profile (REQUIRED, do this FIRST):
    Action: lookup_item_by_id
    Action Input: {{"item_id": "{item_id}"}}

    STEP 2 - Analyze the retrieved data:
    - Restaurant categories
    - Identify EXACT star rating (from stars field) and review_count. This is critical.
    - Identify top strengths (what people praise) and top weaknesses (what people complain about) based on attributes and hours.

    STRICT RULES:
    - If the business profile is not found (returns "No item found"), utilize the internet research data (from internet_research_task) to reconstruct the restaurant categories and characteristics. If internet research is also empty, assume a standard mid-range restaurant profile.
    - You MUST call tools ONE AT A TIME
    - MUST use tool outputs — do NOT invent business facts
    - Action Input must be ONE dictionary only

  expected_output: >
    A structured markdown business report including:
    - Categories
    - Rating and size
    - Key attributes
    - Business Profile Status (Normal or Reconstructed from Web)

  agent: item_analyst


analyze_reviews_task:
  description: >
    Retrieve and analyze historical reviews for user {user_id} and business {item_id}.

    STEP 1 - Retrieve reviews (REQUIRED):
    Action: lookup_reviews_by_user_and_item
    Action Input: {{"user_id": "{user_id}", "item_id": "{item_id}"}}

    STEP 2 - Analyze:
    - Highlight if a direct past review exists between the user and the business.
    - Otherwise, analyze the user's typical ratings/sentiments and the business's common feedback.

    STRICT RULES:
    - You MUST call tools ONE AT A TIME.
    - If no reviews are found, perform cross-feature matching based on restaurant categories (from analyze_item_task) and user averages (from analyze_user_task).

  expected_output: >
    A structured markdown report highlighting:
    - Direct review match (if any)
    - User's typical review tone, preferences, and rating habits
    - Business's strengths, weaknesses, and customer feedback themes
    - Overall match sentiment

  agent: review_analyst


collaborative_reasoning_task:
  description: >
    Combine the User Profile, Item Report, Review Analysis, and External Research.

    Your job is to reason about whether business {item_id} matches user {user_id}'s preferences.

    Analyze:
    - Match between user preferences and restaurant features
    - Possible reasons the user may like the restaurant
    - Possible reasons the user may dislike the restaurant
    - Expected rating direction: low, medium, or high
    - Important evidence from previous task outputs

    STRICT RULES:
    - Do NOT call tools
    - Do NOT invent new facts
    - Use only previous task outputs
    - Be grounded in retrieved data

  expected_output: >
    A concise collaborative reasoning report explaining the likely user-business match.

  agent: prediction_modeler


predict_review_task:
  description: >
    Using the User Profile, Item Report, External Research, Review Analysis, and Collaborative Reasoning,
    predict the Stars as an integer from 1 to 5 and write the Review Text.

    REASONING & ALIGNMENT REQUIREMENTS (MATHEMATICAL HEURISTIC):
    1. Base Score = (User Average Rating + Item Star Rating) / 2.
    2. Feature Matching (Heuristic Adjustment):
       - If a Top Weakness of the business matches a Top Dislike of the user, SUBTRACT 0.5 to 1.0 from the Base Score.
       - If a Top Strength of the business matches a Top Like of the user, ADD 0.5 to 1.0 to the Base Score.
    3. Final Rating constraint: Ensure the final score is between 1.0 and 5.0.
    4. Text Generation: Generate a review text that mirrors the user's typical length, tone, and vocabulary, while EXPLICITLY mentioning the matched strengths or weaknesses used in your calculation to make it realistic.

    STRICT RULES:
    - Do NOT say the data was not found
    - Do NOT invent unsupported facts
    - Output must be valid JSON
    - Use exactly two keys: "stars" and "review"
    - stars: Predict the Star rating as a float from 1.0 to 5.0.

  expected_output: >
    {"stars": 4.0, "review": "The review text..."}

  agent: prediction_modeler


review_prediction_task:
  description: >
    Review the draft prediction from the Prediction Modeler.

    Check:
    - Whether predicted stars are consistent with the user's habits
    - Whether the review text matches business features
    - Whether the prediction is grounded in retrieved data
    - Whether the JSON format is valid
    - Whether the review sounds natural and realistic

    STRICT RULES:
    - Do NOT call tools
    - Do NOT invent new user or business facts
    - Only review the prediction and suggest corrections if needed

  expected_output: >
    A concise review report including:
    - Validity check
    - Problems found, if any
    - Suggested final stars
    - Suggested final review text

  agent: reviewer


final_prediction_task:
  description: >
    Produce the final prediction using:
    - User Profile
    - Item Report
    - External Research
    - Review Analysis
    - Collaborative Reasoning
    - Draft Prediction
    - Reviewer Feedback

    REASONING & ALIGNMENT REQUIREMENTS (MATHEMATICAL HEURISTIC):
    1. Base Score = (User Average Rating + Item Star Rating) / 2.
    2. Feature Matching (Heuristic Adjustment):
       - If a Top Weakness of the business matches a Top Dislike of the user, SUBTRACT 0.5 to 1.0 from the Base Score.
       - If a Top Strength of the business matches a Top Like of the user, ADD 0.5 to 1.0 to the Base Score.
    3. Final Rating constraint: Ensure the final score is between 1.0 and 5.0.
    4. Text Generation: Generate a review text that mirrors the user's typical length, tone, and vocabulary, while EXPLICITLY mentioning the matched strengths or weaknesses used in your calculation to make it realistic.

    STRICT RULES:
    - Output ONLY a valid JSON object
    - Use exactly two keys: "stars" and "review"
    - stars: Predict the Star rating as a float from 1.0 to 5.0 (e.g., 1.0, 3.5, 4.0, or 5.0).
    - review: must be realistic and consistent with stars
    - Avoid generic repeated phrases
    - DO NOT mention raw item IDs or user IDs
    - Do NOT include markdown
    - Do NOT include explanations
    - Do NOT include text before or after the JSON
    - Do NOT use double curly braces

  expected_output: >
    {"stars": 4.0, "review": "The review text..."}

  agent: prediction_modeler