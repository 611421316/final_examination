# === Collaborative-style Sequential Task Definitions ===

internet_research_task:
  description: >
    Provide general insights about restaurant reviews and rating behavior using internet search if available.

    Focus on:
    - Why users give 1–2 stars
    - Why users give 3 stars
    - Why users give 4–5 stars
    - Common rating factors: food, service, price, waiting time, atmosphere

    REQUIRED ACTIONS:
    - Call search_internet using a natural language query.
    - The ONLY valid input key for the tool is "search_query". Do NOT use "description" or any other key.

    STRICT RULES:
    - Do NOT fabricate information about user {user_id} or business {item_id}
    - Only provide general restaurant rating patterns
    - Keep the output concise
    - Maximum 5 bullet points
    - NEVER pass a dictionary with a "description" key to the tool. Use "search_query".

  expected_output: >
    Concise bullet points about general restaurant rating behavior.

  agent: internet_researcher


analyze_user_task:
  description: >
    Analyze user {user_id} using available RAG tools.

    CRITICAL TOOL CALL RULES:
    1. You MUST call tools ONE AT A TIME.
    2. THE ONLY VALID INPUT KEY IS "search_query".
    3. NEVER USE "user_id" AS A KEY.
    4. ALWAYS PASS THE INPUT AS: {{"search_query": "Find profile statistics for user_id {user_id}"}}
    
    Example:
    Action: search_user_profile_data
    Action Input: {{"search_query": "Find profile statistics for user_id {user_id}"}}

    Then analyze:
    - Average rating behavior
    - Sentiment tendency
    - Common preferences
    - Notable behavior patterns
    - Whether this user is strict, neutral, or generous

    STRICT RULES:
    - MUST use tool outputs
    - Do NOT invent user facts
    - Action Input must be ONE dictionary only
    - Do NOT return a list of JSON objects in Action Input

  expected_output: >
    A structured markdown user profile report including:
    - Average rating
    - Sentiment tendency
    - Key preferences
    - Notable behavior patterns
    - Rating style

  agent: user_analyst


analyze_item_task:
  description: >
    Analyze business {item_id} using available RAG tools.

    CRITICAL TOOL CALL RULES:
    1. You MUST call tools ONE AT A TIME.
    2. THE ONLY VALID INPUT KEY IS "search_query".
    3. NEVER USE "item_id" AS A KEY.
    4. ALWAYS PASS THE INPUT AS: {{"search_query": "Find features and categories for item_id {item_id}"}}
    
    Example:
    Action: search_restaurant_feature_data
    Action Input: {{"search_query": "Find features and categories for item_id {item_id}"}}

    Then analyze:
    - Restaurant categories
    - Star rating
    - Attributes
    - Common positive feedback
    - Common negative feedback
    - Overall public sentiment

    STRICT RULES:
    - MUST use tool outputs
    - Do NOT invent business facts
    - Action Input must be ONE dictionary only

  expected_output: >
    A structured markdown business report including:
    - Categories
    - Star rating
    - Attributes
    - Positive feedback
    - Negative feedback
    - Overall sentiment

  agent: item_analyst


collaborative_reasoning_task:
  description: >
    Combine the User Profile, Item Report, and External Research.

    Your job is to reason about whether business {item_id} matches user {user_id}'s preferences.

    Analyze:
    - Match between user preferences and restaurant features
    - Possible reasons the user may like the restaurant
    - Possible reasons the user may dislike the restaurant
    - Expected rating direction: low, medium, or high
    - Important evidence from previous task outputs

    STRICT RULES:
    - Do NOT call tools
    - Do NOT invent new facts
    - Use only previous task outputs
    - Be grounded in retrieved data

  expected_output: >
    A concise collaborative reasoning report explaining the likely user-business match.

  agent: prediction_modeler


predict_review_task:
  description: >
    Using the User Profile, Item Report, External Research, and Collaborative Reasoning,
    predict the Stars from 1 to 5 and write the Review Text.

    Consider:
    - User's historical rating behavior
    - User's sentiment tendency
    - Restaurant strengths and weaknesses
    - General restaurant rating patterns
    - Match between user preferences and business features

    STRICT RULES:
    - Do NOT say the data was not found
    - Do NOT invent unsupported facts
    - Output must be valid JSON
    - Use exactly two keys: "stars" and "review"

  expected_output: >
    {"stars": 4, "review": "The review text..."}

  agent: prediction_modeler


review_prediction_task:
  description: >
    Review the draft prediction from the Prediction Modeler.

    Check:
    - Whether predicted stars are consistent with the user's rating habits
    - Whether the review text matches business features
    - Whether the prediction is grounded in retrieved data
    - Whether the JSON format is valid
    - Whether the review sounds natural and realistic

    STRICT RULES:
    - Do NOT call tools
    - Do NOT invent new user or business facts
    - Only review the prediction and suggest corrections if needed

  expected_output: >
    A concise review report including:
    - Validity check
    - Problems found, if any
    - Suggested final stars
    - Suggested final review text

  agent: reviewer


final_prediction_task:
  description: >
    Produce the final prediction using:
    - User Profile
    - Item Report
    - External Research
    - Collaborative Reasoning
    - Draft Prediction
    - Reviewer Feedback

    STRICT RULES:
    - Output ONLY a valid JSON object
    - Use exactly two keys: "stars" and "review"
    - stars must ONLY be one of: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
    - review must be realistic and consistent with stars
    - Avoid generic repeated phrases
    - DO NOT mention raw item IDs or user IDs
    - Do NOT include markdown
    - Do NOT include explanations
    - Do NOT include text before or after the JSON
    - Do NOT use double curly braces

  expected_output: >
    {"stars": 4.0, "review": "The review text..."}

  agent: prediction_modeler