# === Step 5: Strictly Separated Task Definitions ===

internet_research_task:
  description: >
    Provide general insights about restaurant reviews and rating behavior using internet search if available.

    Focus on:
    - Why users give 1–2 stars
    - Why users give 3 stars
    - Why users give 4–5 stars
    - Common rating factors: food, service, price, waiting time, atmosphere

    REQUIRED ACTIONS:
    - Call search_internet using a natural language query.
    - The ONLY valid input key for the tool is "search_query". Do NOT use "description" or any other key.

    STRICT RULES:
    - Do NOT fabricate information about user {user_id} or business {item_id}
    - Only provide general restaurant rating patterns
    - Keep the output concise
    - Maximum 5 bullet points
    - NEVER pass a dictionary with a "description" key to the tool. Use "search_query".

  expected_output: >
    Concise bullet points about general restaurant rating behavior.

  agent: internet_researcher


# =========================
# USER ANALYSIS
# =========================
analyze_user_task:
  description: >
    Analyze user {user_id} using available tools.

    REQUIRED ACTIONS:
    - Step 1: Call search_user_profile_data using the EXACT user_id {user_id}.
    - Step 2: Call search_historical_reviews_data using the EXACT user_id {user_id}.
    - DO NOT call both tools at the same time. Call them ONE AT A TIME.
    - The ONLY valid input key for the tools is "search_query". Do NOT use "user_id" as a key.
    - ALWAYS pass the "{user_id}" inside the search_query string. Do NOT pass a JSON object with user_id.

    Then:
    - Identify average rating
    - Identify sentiment tendency (positive/neutral/negative)
    - Identify common keywords or preferences (e.g. food quality, service, price)

    STRICT RULES:
    - MUST use tool outputs
    - ALWAYS include the EXACT string "{user_id}" in your search_query.
    - NEVER return a list of JSON objects in Action Input. Only ONE dictionary.

  expected_output: >
    A structured markdown report including:
    - Average rating
    - Sentiment tendency
    - Key preferences
    - Notable behavior patterns

  agent: user_analyst


# =========================
# ITEM ANALYSIS
# =========================
analyze_item_task:
  description: >
    Analyze business {item_id} using available tools.

    REQUIRED ACTIONS:
    - Step 1: Call search_restaurant_feature_data using the EXACT item_id {item_id}.
    - Step 2: Call search_historical_reviews_data using the EXACT item_id {item_id}.
    - DO NOT call both tools at the same time. Call them ONE AT A TIME.
    - The ONLY valid input key for the tools is "search_query". Do NOT use "item_id" as a key.
    - ALWAYS pass the "{item_id}" inside the search_query string. Do NOT pass a JSON object with item_id.

    Then:
    - Identify categories (e.g. restaurant type)
    - Identify strengths (pros)
    - Identify weaknesses (cons)
    - Identify general sentiment from reviews

    STRICT RULES:
    - MUST use tool outputs
    - ALWAYS include the EXACT string "{item_id}" in your search_query.
    - NEVER return a list of JSON objects in Action Input. Only ONE dictionary.

  expected_output: >
    A structured markdown report including:
    - Categories
    - Strengths (pros)
    - Weaknesses (cons)
    - Overall sentiment

  agent: item_analyst


# =========================
# FINAL PREDICTION
# =========================
predict_review_task:
  description: >
    Predict the rating and generate a review based on:

    - User Profile (from analyze_user_task)
    - Item Report (from analyze_item_task)
    - General patterns (from external_research_task)

    REASONING REQUIREMENTS:
    - Compare user preferences vs item characteristics
    - Determine if the item matches the user's expectations
    - Adjust rating accordingly

    STRICT RULES:
    - MUST use previous task outputs
    - DO NOT say "data not found"
    - DO NOT hallucinate unrelated facts
    - Keep reasoning implicit (DO NOT print reasoning)

  expected_output: >
    Output ONLY a valid JSON object:
    {"stars": <float between 1.0 and 5.0>, "review": "<natural review text>"}

    RULES:
    - stars must be an float between 1.0 and 5.0
    - review must be realistic and consistent with stars
    - NO explanation
    - NO markdown
    - NO extra text

  agent: prediction_modeler